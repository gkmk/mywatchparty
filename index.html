<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>My Watch Party – Watch multiple Twitch, YouTube &amp; Kick streams at once</title>
    <meta name="description"
        content="Watch all your favorite streamers on one page. Add Twitch, YouTube, Kick and Facebook live streams side by side, switch audio with one click and share your watch party with a link. Free, no sign-up.">
    <link rel="canonical" href="https://mywatchparty.com/">
    <meta name="theme-color" content="#0D1B2A">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My Watch Party">
    <meta property="og:url" content="https://mywatchparty.com/">
    <meta property="og:title" content="My Watch Party – Watch multiple streams at once">
    <meta property="og:description"
        content="All your favorite streamers on one page. No more 100 open tabs. Watch Twitch, YouTube, Kick and Facebook streams side by side.">
    <meta property="og:image" content="https://mywatchparty.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="My Watch Party logo next to the text: watch multiple streams at once">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Watch Party – Watch multiple streams at once">
    <meta name="twitter:description"
        content="All your favorite streamers on one page. No more 100 open tabs. Watch Twitch, YouTube, Kick and Facebook streams side by side.">
    <meta name="twitter:image" content="https://mywatchparty.com/og-image.png">
    <meta name="twitter:image:alt" content="My Watch Party logo next to the text: watch multiple streams at once">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "My Watch Party",
        "url": "https://mywatchparty.com/",
        "description": "Watch multiple Twitch, YouTube, Kick and Facebook live streams at once on a single page.",
        "applicationCategory": "EntertainmentApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "image": "https://mywatchparty.com/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Quicksand:wght@600;700&display=swap">
    <link rel="stylesheet" href="main.css?v=61d5d27e">

    <script src="main.js?v=70c89e18" defer></script>
</head>

<body class="flex min-h-screen flex-col bg-gray-dark font-sans text-gray-light">
    <a href="#main"
        class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-yellow focus:p-2 focus:text-gray-dark">Skip
        to content</a>

    <header class="flex flex-wrap items-center gap-3 px-4 py-2">
        <img src="logo-small.png" alt="" width="36" height="42" class="h-10 w-auto">
        <h1 class="mr-auto font-display text-lg font-bold">My Watch Party</h1>
        <p id="status" class="text-sm text-yellow" aria-live="polite"></p>
        <button type="button" class="btn-primary" data-action="add">
            <span aria-hidden="true">+</span> Add stream
        </button>
        <button type="button" class="btn-secondary hidden" id="share-button">Copy share link</button>
    </header>

    <main id="main" tabindex="-1" class="flex flex-1 flex-col px-4 pb-6 outline-none">
        <section id="empty-state"
            class="m-auto flex w-full max-w-6xl flex-col items-center justify-center gap-10 py-10 lg:flex-row lg:gap-20">
            <div class="hero-logo">
                <img src="logo-hero.webp" alt="My Watch Party monster holding a TV screen" width="277" height="320"
                    class="h-56 w-auto sm:h-72 lg:h-96">
            </div>
            <div class="max-w-2xl text-center lg:text-left">
                <h2 class="text-balance font-display text-4xl font-bold leading-[1.1] sm:text-5xl lg:text-6xl">Watch multiple streams at once
                </h2>
                <p class="mt-5 text-balance text-xl text-purple lg:text-2xl">All your favorite streamers on one page. No more 100 open tabs.</p>
                <div class="mt-10 flex flex-wrap justify-center gap-3 lg:justify-start">
                    <button type="button" class="chip" data-action="add" data-platform="twitch"
                        aria-label="Add a Twitch stream"><span aria-hidden="true">+</span> Twitch</button>
                    <button type="button" class="chip" data-action="add" data-platform="youtube"
                        aria-label="Add a YouTube stream"><span aria-hidden="true">+</span> YouTube</button>
                    <button type="button" class="chip" data-action="add" data-platform="kick"
                        aria-label="Add a Kick stream"><span aria-hidden="true">+</span> Kick</button>
                    <button type="button" class="chip" data-action="add" data-platform="facebook"
                        aria-label="Add a Facebook stream"><span aria-hidden="true">+</span> Facebook</button>
                </div>
            </div>
        </section>

        <div id="screens" class="screens hidden w-full" tabindex="-1" aria-label="Streams"></div>
    </main>

    <footer class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2 px-4 py-6 text-xs text-purple">
        <label class="flex items-center gap-2">
            <input type="checkbox" id="shortcuts-toggle" checked class="h-4 w-4 accent-yellow">
            Shortcuts: <kbd>+</kbd> add · <kbd>1</kbd>–<kbd>9</kbd> switch · <kbd>M</kbd> mute
        </label>
        <a href="https://github.com/gkmk/mywatchparty/issues">Report a bug on GitHub</a>
    </footer>

    <dialog id="add-dialog" aria-labelledby="add-dialog-title"
        class="w-[min(32rem,calc(100%-2rem))] rounded-2xl bg-gray p-6 ring-2 ring-blue text-gray-light backdrop:bg-black/70">
        <form id="add-form" novalidate>
            <h2 id="add-dialog-title" class="font-display text-xl font-bold">Add a stream</h2>
            <label for="stream-url" class="mt-4 block text-sm">Stream link</label>
            <input type="url" id="stream-url" name="url" required autocomplete="off" inputmode="url"
                placeholder="https://www.twitch.tv/…" aria-describedby="stream-url-hint stream-url-error"
                class="mt-1 w-full rounded-lg border-0 bg-gray-dark px-3 py-2 ring-1 ring-blue aria-[invalid=true]:ring-2 aria-[invalid=true]:ring-orange">
            <p id="stream-url-error" class="mt-2 hidden text-sm text-orange" role="alert"></p>
            <p id="stream-url-hint" class="mt-2 text-xs text-slate-300">Works with Twitch, YouTube, Kick and Facebook.</p>
            <div class="mt-6 flex justify-end gap-2">
                <button type="button" class="btn-secondary" id="add-cancel">Cancel</button>
                <button type="submit" class="btn-primary">Add stream</button>
            </div>
        </form>
    </dialog>
</body>

</html>
